<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國二公校開學訂餐明細查詢</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #ffffff; width: 100%; max-width: 460px; padding: 28px 22px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin-top: 0; color: #1a365d; font-size: 22px; }
    .subtitle { text-align: center; color: #718096; font-size: 14px; margin-bottom: 22px; }
    .input-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3748; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #cbd5e0; border-radius: 8px; font-size: 18px; text-align: center; letter-spacing: 2px; }
    input[type="text"]:focus { outline: none; border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49,130,206,0.15); }
    button { width: 100%; background: #2b6cb0; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2c5282; }
    
    .result-box { margin-top: 22px; padding: 18px 16px; background: #ebf8ff; border-radius: 10px; border: 1px solid #bee3f8; display: none; }
    .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; color: #2d3748; }
    .result-item .label { color: #4a5568; }
    .result-item .val { font-weight: bold; }
    
    .money-paid { color: #2b6cb0; }
    .money-balance { color: #dd6b20; font-size: 16px; }
    .diet-val { color: #e53e3e; font-weight: 600; }
    
    /* 分隔線 */
    .divider { border: 0; border-top: 1px dashed #bee3f8; margin: 12px 0; }

    /* 日期清單標籤區 */
    .dates-container { margin-top: 10px; }
    .dates-title { font-size: 14px; font-weight: 600; color: #2b6cb0; margin-bottom: 10px; }
    .date-badge-wrap { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; padding-right: 2px; }
    .date-badge { background: #ffffff; border: 1px solid #90cdf4; color: #2c5282; padding: 5px 9px; border-radius: 6px; font-size: 13px; font-weight: 500; }
    .date-badge.exam { background: #fffaf0; border-color: #fbd38d; color: #c05621; }
    .no-dates { color: #a0aec0; font-size: 13px; font-style: italic; }

    .error-msg { margin-top: 16px; color: #e53e3e; text-align: center; font-size: 14px; display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>國二公校開學訂餐明細查詢</h2>
  <div class="subtitle">請輸入表單填寫之「匯款末五碼」</div>

  <div class="input-group">
    <label for="bankCode">匯款末五碼（或登記末五碼）</label>
    <input type="text" id="bankCode" placeholder="例如：01412" autocomplete="off">
  </div>

  <button onclick="handleSearch()">查 詢</button>

  <div id="errorMsg" class="error-msg">查無此帳號紀錄，請確認末五碼是否正確</div>

  <div id="resultBox" class="result-box">
    <div class="result-item">
      <span class="label">小朋友姓名：</span>
      <span class="val" id="resName">-</span>
    </div>
    <div class="result-item">
      <span class="label">飲食禁忌：</span>
      <span class="val diet-val" id="resDiet">-</span>
    </div>
    <div class="result-item">
      <span class="label">總訂餐餐數：</span>
      <span class="val" id="resCount">-</span>
    </div>
    
    <hr class="divider">
    
    <div class="result-item">
      <span class="label">應繳金額：</span>
      <span class="val" id="resTotalFee">-</span>
    </div>
    <div class="result-item">
      <span class="label">已繳金額：</span>
      <span class="val money-paid" id="resPaid">-</span>
    </div>
    <div class="result-item">
      <span class="label">剩餘應繳/餘額：</span>
      <span class="val money-balance" id="resBalance">-</span>
    </div>

    <!-- 訂餐日期明細 -->
    <div class="dates-container">
      <hr class="divider">
      <div class="dates-title">已登記訂餐日期明細：</div>
      <div class="date-badge-wrap" id="resDatesWrap"></div>
    </div>
  </div>
</div>

<script>
  let studentsData = [];

  window.onload = function() {
    fetch('data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => { studentsData = data; })
      .catch(err => console.error("載入失敗", err));
  };

  function handleSearch() {
    const inputVal = document.getElementById('bankCode').value.trim();
    const resultBox = document.getElementById('resultBox');
    const errorMsg = document.getElementById('errorMsg');
    const datesWrap = document.getElementById('resDatesWrap');

    if (!inputVal) {
      alert('請輸入匯款末五碼');
      return;
    }

    const match = studentsData.find(item => String(item.bank_last5).trim() === inputVal);

    if (match) {
      const dates = match.dates || [];
      
      document.getElementById('resName').textContent = match.name;
      document.getElementById('resDiet').textContent = match.diet || '無特殊禁忌';
      document.getElementById('resCount').textContent = (match.count || dates.length) + ' 餐';
      
      document.getElementById('resTotalFee').textContent = (Number(match.total_fee) || 0).toLocaleString() + ' 元';
      document.getElementById('resPaid').textContent = (Number(match.paid) || 0).toLocaleString() + ' 元';
      document.getElementById('resBalance').textContent = (Number(match.balance) || 0).toLocaleString() + ' 元';
      
      // 產生日期標籤
      datesWrap.innerHTML = '';
      if (dates.length > 0) {
        dates.forEach(d => {
          const badge = document.createElement('span');
          badge.className = d.includes('考衝') ? 'date-badge exam' : 'date-badge';
          badge.textContent = d;
          datesWrap.appendChild(badge);
        });
      } else {
        datesWrap.innerHTML = '<span class="no-dates">目前尚無登記訂餐日期</span>';
      }

      errorMsg.style.display = 'none';
      resultBox.style.display = 'block';
    } else {
      resultBox.style.display = 'none';
      errorMsg.style.display = 'block';
    }
  }

  document.getElementById('bankCode').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleSearch();
  });
</script>

</body>
</html>
